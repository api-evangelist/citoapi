  /cs2/live/stream:
    get:
      summary: Live update stream (SSE)
      description: 'Server-Sent Events stream of live match updates, on every plan. Keep the connection open; each `cs2.live.update` event carries the changed match. Pass `matchId` to follow one match.


        Events: `ready` (sent first; carries `delay_seconds` and `billing`), `cs2.live.update`, `ping` every 15 seconds, and `error` just before the server closes the stream.


        **Billing.** An open stream counts toward your monthly quota like polling: one request when it connects, then one request for every 15 seconds it stays open (the same as polling `/cs2/live` every 15 seconds; 5,760 requests a day if held open around the clock). When the quota runs out the stream sends an `error` event with code `RATE_LIMIT_EXCEEDED` and closes; connecting with no quota left returns 429.


        **Delay.** Free and Starter plans receive every update 60 seconds late, the same delay as the polled live endpoints. Other plans are real-time.


        Room-based WebSockets (Scale and Enterprise, or the Live WebSockets add-on): `wss://api.citoapi.com/api/v1/cs2/live/ws`.'
      operationId: getCs2LiveStream
      tags:
      - CS2
      parameters:
      - name: matchId
        in: query
        required: false
        description: Match id.
        schema:
          type: string
      responses:
        '200':
          description: Live update stream (SSE)
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: ready

                data: {"success":true,"stream":"cs2.live","matchId":null,"live":true,"delay_seconds":0,"billing":{"requests_per_interval":1,"interval_seconds":15}}


                event: cs2.live.update

                data: {"type":"cs2.live.update","matchId":"cs2-match-2398654","status":"live","team1Score":0,"team2Score":0,"currentMap":"de_inferno","currentRound":1,"roundTimeSeconds":null,"bombPlanted":false,"playerStatsChanged":true,"fullState":true,"capturedAt":"2026-09-25T16:29:17.470Z"}


                event: ping

                data: {"ok":true,"ts":"2026-09-25T16:29:30.000Z"}


                event: error

                data: {"success":false,"error":{"code":"RATE_LIMIT_EXCEEDED","message":"You have used 500 of 500 requests in your current period. It resets on 2026-10-01 (about 6 days)."}}

                '
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
        '429':
          description: Monthly request quota already used up when connecting. Mid-stream, the same limit arrives as an `error` event and the stream closes.
