        required: false
        description: Comma-separated list of fields to return.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start of the date range (ISO 8601, UTC).
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Rows to return. Maximum 200; larger values are reduced to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: offset
        in: query
        required: false
        description: Rows to skip, for paging.
        schema:
          type: integer
          minimum: 0
      - name: order
