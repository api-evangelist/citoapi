openapi: 3.2.0
info:
  title: Cito CS2 API
  version: 1.0.0
  description: Utilities API — QR code generation and sports/esports data (Fortnite, CoD, LoL, Apex, Dota 2, CS2, UFC, Tennis, RAF Wrestling, BKFC).
  contact:
    name: Cito API Support
    url: https://citoapi.com
  x-logo:
    url: https://citoapi.com/logo.png
servers:
- url: https://api.citoapi.com/api/v1
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: CS2
  description: 'Counter-Strike 2: live matches, results, maps, rounds, teams, players, events, rankings, stats and skins.'
paths:
  /cs2:
    get:
      summary: CS2 API overview
      description: Coverage counts (matches, teams, players, events, demos) and links to the main endpoints.
      operationId: getCs2
      tags:
      - CS2
      responses:
        '200':
          description: CS2 API overview
          content:
            application/json:
              example:
                success: true
                data:
                  entityType: cs2_api_overview
                  name: Counter-Strike 2 API
                  status: available
                  coverage:
                    matches: 14398
                    live: 1
                    upcoming: 120
                    teams: 4470
                    players: 8545
                    events: 1502
                    rosterChanges: 149615
                    demos: 26893
                    playerPeriodStats: 47466
                    teamPeriodStats: 1677
                  endpoints:
                    live: /api/v1/cs2/live
                    liveState: /api/v1/cs2/live/{matchId}/state
                    liveScoreboard: /api/v1/cs2/live/{matchId}/scoreboard
                    liveEvents: /api/v1/cs2/live/{matchId}/events
                    matches: /api/v1/cs2/matches
                    matchPlayerStats: /api/v1/cs2/matches/{matchId}/player-stats
                    matchMaps: /api/v1/cs2/matches/{matchId}/maps
                    matchDemos: /api/v1/cs2/matches/{matchId}/demos
                    gameStats: /api/v1/cs2/games/{gameId}/stats
                    gameRounds: /api/v1/cs2/games/{gameId}/rounds
                    gameEvents: /api/v1/cs2/games/{gameId}/events
                    teams: /api/v1/cs2/teams
                    teamRosterHistory: /api/v1/cs2/teams/{teamId}/roster-history
                    teamTrends: /api/v1/cs2/teams/{teamId}/trends
                    players: /api/v1/cs2/players
                    playerCareer: /api/v1/cs2/players/{playerId}/career
                    playerSeasons: /api/v1/cs2/players/{playerId}/seasons
                    playerTransfers: /api/v1/cs2/players/{playerId}/transfers
                    events: /api/v1/cs2/events
                    activeEvents: /api/v1/cs2/events/active
                    eventCalendar: /api/v1/cs2/events/calendar
                    eventParticipants: /api/v1/cs2/events/{eventId}/participants
                    rosterChanges: /api/v1/cs2/roster-changes/recent
                    rankings: /api/v1/cs2/rankings/teams
                    aggregateStats:
                      players: /api/v1/cs2/stats/players
                      teams: /api/v1/cs2/stats/teams
                      maps: /api/v1/cs2/stats/maps
                      weapons: /api/v1/cs2/stats/weapons
                      pistolRounds: /api/v1/cs2/stats/pistol-rounds
                      openingDuels: /api/v1/cs2/stats/opening-duels
                      clutches: /api/v1/cs2/stats/clutches
                      flashAssists: /api/v1/cs2/stats/flash-assists
                      utility: /api/v1/cs2/stats/utility
                      economy: /api/v1/cs2/stats/economy
                      mapPool: /api/v1/cs2/map-pool
                meta: {}
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
  /cs2/status/sync:
    get:
      summary: CS2 data freshness
      description: 'Whether CS2 data is current: `current_status`, `freshness` (`fresh` or `stale`) and the time of the last successful update.'
      operationId: getCs2StatusSync
      tags:
      - CS2
      responses:
        '200':
          description: CS2 data freshness
          content:
            application/json:
              example:
                success: true
                data:
                  entity_type: cs2_sync_health
                  current_status: healthy
                  freshness: fresh
                  last_successful_sync_at: '2026-09-23T01:21:07.356Z'
                  checked_at: '2026-09-23T01:21:30.000Z'
                meta: {}
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
  /cs2/changelog:
    get:
      summary: CS2 data changelog
      description: Recent changes to stored CS2 records (field, old value, new value, time). Values longer than 500 characters are truncated; pass `entity_id` with `full=true` for complete values.
      operationId: getCs2Changelog
      tags:
      - CS2
      parameters:
      - name: action
        in: query
        required: false
        description: Filter by `action`.
        schema:
          type: string
      - name: entity_id
        in: query
        required: false
        description: Only changes to this record.
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        description: Only changes to this kind of record.
        schema:
          type: string
      - name: full
        in: query
        required: false
        description: '`true` returns complete values instead of truncated ones.'
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        description: Rows to return. Maximum 200; larger values are reduced to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Rows to skip, for paging.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: CS2 data changelog
          content:
            application/json:
              example:
                success: true
                data:
                - id: cmudj3yqa00pi10aqe361juo3
                  entityType: cs2_match
                  entityId: cs2-match-2398521
                  fieldPath: liveState
                  oldValue: '{"teams":{"team1Name":"Club 333","team2Name":"DETONATE","ctTeamName":"CT","terroristTeamName":"Terrorist"},"sourceId":"2398521","source":"live feed_polling","status":"live","matchId":"source-match-2398521","roundEnds":[{"winner":"CT","ev...'
                  newValue:
                    status: upcoming
                    team1Score: null
                    team2Score: null
                    winnerTeamId: null
                  action: merge_rejected
                  createdAt: '2026-09-23T03:13:58.161Z'
                - id: cmudj23cl00ph10aq427s8v0b
                  entityType: cs2_map_player_stat
                  entityId: cs2-match-2398520-map-2:twigs
                  fieldPath: rating,headshotPercent
                  oldValue: '{"id":"live-source-match-2398520-map-2-twigs","adr":52.5,"raw":{"hp":55,"adr":52.5,"raw":{"hp":55,"dbId":23376,"name":"twigs","nick":"twigs","alive":true,"facts":[],"money":1050,"score":13,"deaths":16,"helmet":true,"kevlar":true,"assists...'
                  newValue: '{"id":"live-source-match-2398520-map-2-twigs","adr":52.5,"raw":{"hp":55,"adr":52.5,"raw":{"hp":55,"dbId":23376,"name":"twigs","nick":"twigs","alive":true,"facts":[],"money":1050,"score":13,"deaths":16,"helmet":true,"kevlar":true,"assists...'
                  action: merge_accepted
                  createdAt: '2026-09-23T03:12:30.837Z'
                meta:
                  total: 1242453
                  limit: 2
                  valuesTruncatedAt: 500
                  count: 2
                  page: 1
                  totalPages: 621227
                  hasNext: true
                  hasPrev: false
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
  /cs2/webhooks/events:
    get:
      summary: CS2 webhook event types
      description: The event types a CS2 webhook can subscribe to, with example payloads.
      operationId: getCs2WebhooksEvents
      tags:
      - CS2
      responses:
        '200':
          description: CS2 webhook event types
          content:
            application/json:
              example:
                success: true
                available_on_plans:
                - PRO
                - BUSINESS
                management_endpoint: /api/v1/webhooks
                create_endpoint: POST /api/v1/webhooks
                events:
                - cs2.match.started
                - cs2.match.live_started
                example_payload:
                  event: cs2.score.updated
                  id: 7f4c2d0d8f2f4b2ca6c6f35c4d53c2aa
                  timestamp: '2026-09-23T03:15:09.506Z'
                  data:
                    matchId: cs2_match_2395230
                    team1Score: 1
                    team2Score: 0
                    currentMap: mirage
                signature_headers:
                - X-Cito-Signature
                - X-Cito-Event
                signing:
                  algorithm: HMAC-SHA256
                  signedContent: UTF-8 bytes of the exact JSON request body sent by Cito
                  bodySerialization: JSON.stringify(payload)
                  signatureHeader: X-Cito-Signature
                  signatureEncoding: hex
                  signaturePrefix: none
                  secretFormat: Use the exact webhook secret value shown when the webhook is created or regenerated. No whsec_ prefix is used.
                  verificationRule: Verify against the raw request body bytes before reparsing or reserializing JSON.
                  sampleSecret: cito_test_secret_123
                  samplePayload:
                    event: lol.live.state
                    id: sample-event-id-123
                    timestamp: '2026-06-07T16:00:00.000Z'
                    data:
                      gameId: lol-game-123
                      matchId: lol-match-123
                      league: LEC
                      gameTime: 1337
                      blueTeam:
                        tag: G2
                        kills: 7
                        gold: 24800
                        towers: 3
                        dragons: 2
                        barons: 0
                      redTeam:
                        tag: FNC
                        kills: 5
                        gold: 23700
                        towers: 2
                        dragons: 1
                        barons: 0
                  samplePayloadString: '{"event":"lol.live.state","id":"sample-event-id-123","timestamp":"2026-06-07T16:00:00.000Z","data":{"gameId":"lol-game-123","matchId":"lol-match-123","league":"LEC","gameTime":1337,"blueTeam":{"tag":"G2","kills":7,"gold":24800,"towers":3...'
                  sampleSignature: 97db77f5cd96e09a70dcf6cc75fc5d92d780c41ce82c853b51e4070954c54171
                  sampleHeaders:
                    Content-Type: application/json
                    X-Cito-Signature: 97db77f5cd96e09a70dcf6cc75fc5d92d780c41ce82c853b51e4070954c54171
                    X-Cito-Event: lol.live.state
                    X-Cito-Event-Id: sample-event-id-123
                    X-Cito-Timestamp: '2026-06-07T16:00:00.000Z'
                    X-Cito-Delivery-Attempt: '1'
                live_sse_stream: /api/v1/cs2/live/stream?matchId={matchId}
                docs: https://citoapi.com/docs/api/cs2
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
  /cs2/webhooks:
    get:
      summary: CS2 webhook event types
      description: 'The event types a CS2 webhook can subscribe to, with example payloads.


        Same response as `GET /api/v1/cs2/webhooks/events`.'
      operationId: getCs2Webhooks
      tags:
      - CS2
      responses:
        '200':
          description: CS2 webhook event types
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
      x-alias-of: /cs2/webhooks/events
    post:
      summary: How to register a CS2 webhook
      description: 'Returns the steps and payload for registering a CS2 webhook in the dashboard. It does not create a subscription.


        Same response as `GET /api/v1/cs2/webhooks/events`.'
      operationId: postCs2Webhooks
      tags:
      - CS2
      responses:
        '200':
          description: How to register a CS2 webhook
        '401':
          description: Missing or invalid API key.
        '403':
          description: Your plan does not include CS2.
      x-alias-of: /cs2/webhooks/events
  /cs2/search:
    get:
      summary: Search CS2
      description: Search teams, players, events and matches by name. Requires `q`.
