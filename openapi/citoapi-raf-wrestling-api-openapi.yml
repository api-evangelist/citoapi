components:
  schemas:
    RafEvent:
      type: object
      properties:
        slug:
          type: string
          example: raf07
        name:
          type: string
          example: RAF 07
        headline:
          type: string
          example: Tsarukyan vs Poullas
        type:
          type: string
          enum:
          - flagship
          - international
        number:
          type:
          - integer
          - 'null'
        sequence:
          type: integer
        status:
          type: string
          enum:
          - scheduled
          - live
          - completed
          - postponed
          - cancelled
        cancellation:
          type:
          - object
          - 'null'
          description: Present when status is cancelled.
          properties:
            reason:
              type:
              - string
              - 'null'
              example: event_page_removed
        previousDates:
          type: array
          items:
            type: string
            format: date
        date:
          type: string
          format: date
        localTime:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        startsAt:
          type:
          - string
          - 'null'
          format: date-time
        location:
          type: object
          properties:
            text:
              type: string
            venue:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            country:
              type:
              - string
              - 'null'
        attendance:
          type:
          - integer
          - 'null'
        bouts:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
        card:
          type: array
          items:
            $ref: '#/components/schemas/RafBout'
    RafSearchResult:
      type: object
      properties:
        type:
          type: string
          enum:
          - athlete
          - event
        slug:
          type: string
        name:
          type: string
        score:
          type: number
    RafError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
            docs:
              type: string
    RafTitle:
      type: object
      properties:
        titleKey:
          type: string
          example: men-heavyweight
        name:
          type: string
        type:
          type: string
        gender:
          type: string
        vacant:
          type: boolean
        champion:
          type:
          - object
          - 'null'
          properties:
            slug:
              type: string
            name:
              type: string
    RafAthlete:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        gender:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        hometown:
          type:
          - string
          - 'null'
        club:
          type:
          - string
          - 'null'
        age:
          type:
          - integer
          - 'null'
        record:
          type: object
          properties:
            wins:
              type: integer
            losses:
              type: integer
            draws:
              type: integer
            bouts:
              type: integer
        titles:
          type: array
          items:
            type: object
    RafBout:
      type: object
      properties:
        boutId:
          type: string
          example: raf07--arman-tsarukyan--georgio-poullas
        event:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            date:
              type: string
              format: date
        order:
          type: integer
          description: 1 = main event
        slot:
          type:
          - string
          - 'null'
          example: MAIN EVENT
        weightClass:
          type: object
          properties:
            label:
              type: string
            key:
              type:
              - string
              - 'null'
            limitLb:
              type:
              - integer
              - 'null'
            gender:
              type:
              - string
              - 'null'
            crossover:
              type: boolean
        titleFight:
          type:
          - string
          - 'null'
          enum:
          - championship
          - interim
        status:
          type: string
          enum:
          - scheduled
          - completed
          - cancelled
        athletes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              country:
                type:
                - string
                - 'null'
                description: ISO-3
              age:
                type:
                - integer
                - 'null'
              club:
                type:
                - string
                - 'null'
              hometown:
                type:
                - string
                - 'null'
              score:
                type:
                - integer
                - 'null'
              takedowns:
                type:
                - integer
                - 'null'
              result:
                type:
                - string
                - 'null'
                enum:
                - win
                - loss
        winner:
          type:
          - object
          - 'null'
          properties:
            slug:
              type: string
            name:
              type: string
        result:
          type:
          - object
          - 'null'
          properties:
            method:
              type:
              - string
              - 'null'
              enum:
              - decision
              - criteria
              - tech_fall
              - fall
              - injury_default
              - disqualification
              - forfeit
            methodConfirmed:
              type: boolean
              description: false when the method is derived from the score (tie = criteria, 10+ margin = tech fall)
            score:
              type:
              - string
              - 'null'
              example: 9-3
            winnerScore:
              type:
              - integer
              - 'null'
            loserScore:
              type:
              - integer
              - 'null'
            margin:
              type:
              - integer
              - 'null'
            endPeriod:
              type:
              - integer
              - 'null'
            endClock:
              type:
              - string
              - 'null'
            elapsedSeconds:
              type:
              - integer
              - 'null'
        periods:
          type: array
          items:
            type: object
            properties:
              period:
                type: integer
              scores:
                type: array
                items:
                  type:
                  - integer
                  - 'null'
        periodScoresReliable:
          type: boolean
        cancellation:
          type:
          - object
          - 'null'
          description: Present when status is cancelled (bouts off the card are kept, never deleted; ask with includeCancelled=true).
          properties:
            reason:
              type: string
              enum:
              - removed_from_card
              - moved
              - opponent_changed
              - event_cancelled
            movedToEvent:
              type:
              - string
              - 'null'
              description: Event slug the same two athletes are now booked on.
            replacedByBoutId:
              type:
              - string
              - 'null'
              description: Bout on the same card where one of the athletes now competes.
            removedAt:
              type:
              - string
              - 'null'
              format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Cito API key. Get one at https://citoapi.com
