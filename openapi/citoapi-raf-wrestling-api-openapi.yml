openapi: 3.2.0
info:
  title: Cito RAF Wrestling API
  version: 1.0.0
  description: Utilities API — QR code generation and sports/esports data (Fortnite, CoD, LoL, Apex, Dota 2, CS2, UFC, Tennis, RAF Wrestling, BKFC).
  contact:
    name: Cito API Support
    url: https://citoapi.com
  x-logo:
    url: https://citoapi.com/logo.png
servers:
- url: https://api.citoapi.com/api/v1
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: RAF Wrestling
  description: 'Real American Freestyle professional wrestling: events, cards, results with per-period scores and takedowns, athletes, champions and live results.'
paths:
  /raf:
    get:
      tags:
      - RAF Wrestling
      summary: RAF overview
      description: League summary, counts, next and last event, current champions.
      parameters: []
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RafError'
        '404':
          description: Not found (RAF_EVENT_NOT_FOUND, RAF_BOUT_NOT_FOUND, RAF_ATHLETE_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RafError'
      operationId: getRaf
      x-operation-id-source: derived
  /raf/search:
    get:
      tags:
      - RAF Wrestling
      summary: Search athletes and events
      description: Name or slug to ids. Use before deep calls.
      parameters:
      - name: q
        in: query
        description: Free-text filter.
        schema:
          type: string
        required: true
      - name: type
        in: query
        schema:
          type: string
          enum:
          - athlete
          - event
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
