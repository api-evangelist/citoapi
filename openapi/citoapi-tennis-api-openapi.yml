  /tennis/matches/{match_id}/tournament-link:
    get:
      tags:
      - Tennis
      summary: Resolve a Match Id to Its Tournament (Any Id Dialect)
      description: 'Accepts any match id dialect (bare live s365_, archived

        s365__, or atp___) and reports what

        tournament it belongs to. `tournament_id` is only ever a verified FK from

        the match archive; a live/upcoming match that has not been reconciled to

        a tournament row yet reports `tournament_id: null` with `tournament_name`

        (free text) and a `reason`, rather than a guessed id.'
      operationId: tennis_get_match_tournament_link_matches__match_id__tournament_link_get
      parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          title: Match Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
