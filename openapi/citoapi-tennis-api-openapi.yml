openapi: 3.2.0
info:
  title: Cito Tennis API
  version: 1.0.0
  description: Utilities API — QR code generation and sports/esports data (Fortnite, CoD, LoL, Apex, Dota 2, CS2, UFC, Tennis, RAF Wrestling, BKFC).
  contact:
    name: Cito API Support
    url: https://citoapi.com
  x-logo:
    url: https://citoapi.com/logo.png
servers:
- url: https://api.citoapi.com/api/v1
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: Tennis
paths:
  /tennis/live/ws:
    get:
      summary: Tennis Live WebSocket (point-by-point)
      operationId: tennisLiveWebsocket
      tags:
      - Tennis
      description: 'WebSocket endpoint, not a plain GET: open it with an HTTP Upgrade to wss://api.citoapi.com/api/v1/tennis/live/ws. Push feed for live tennis. Requires an API key with tennis access AND the live-WebSocket add-on; without the add-on the upgrade is refused. Auth on the upgrade, any one of: x-api-key header, Authorization: Bearer, ?apiKey= or ?x-api-key= in the query string. On connect the server sends a self-describing {"type":"ready"} frame carrying the protocol and event list, so a client can discover the contract at runtime. Client frames: {"action":"subscribe","rooms":["match:{matchId}","all"]}, {"action":"unsubscribe","rooms":[...]}, {"action":"ping"}. Max 32 rooms per connection. Server frames: {"type":"subscribed"}, {"type":"pong"}, {"type":"error","code":"INVALID_JSON"|"BAD_ROOMS"}, and the events {"type":"POINT_UPDATE"} and {"type":"MATCH_FINISHED"}, each carrying a data object keyed by match_id. matchId values come from /tennis/matches/live. There is no SSE variant for tennis; the WebSocket is the only push transport.'
      responses:
        '101':
          description: 'Switching Protocols: the WebSocket is open.'
        '401':
          description: Missing or invalid API key on the upgrade request.
        '403':
          description: API key lacks tennis access or the live-WebSocket add-on.
  /tennis/health:
    get:
      tags:
      - Tennis
      summary: Service Health Check
      description: Returns application health and database connection status.
      operationId: tennis_health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
      security:
      - ApiKeyAuth: []
  /tennis/health/sync:
    get:
      tags:
      - Tennis
      summary: Background Sync Status
      description: Returns status and execution timestamps of background sync jobs.
      operationId: tennis_health_sync_health_sync_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Sync Health Sync Get
      security:
      - ApiKeyAuth: []
  /tennis/matches/live:
    get:
      tags:
      - Tennis
      summary: List Active Live Matches
      description: Retrieves all currently active in-progress tennis matches with live scores.
      operationId: tennis_list_live_matches_matches_live_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 500
            minimum: 1
