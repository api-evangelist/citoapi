        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisPaginatedResponse_PlayerListItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisHTTPValidationError'
      security:
      - ApiKeyAuth: []
