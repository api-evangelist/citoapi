      summary: Upcoming Scheduled Matches
      description: 'Scheduled fixtures for the next ~3 days, soonest first.


        Fed by the same source as the live board; a fixture keeps its match_id

        when it goes live, so ids are stable across upcoming -> live -> finished.'
      operationId: tennis_list_upcoming_matches_matches_upcoming_get
