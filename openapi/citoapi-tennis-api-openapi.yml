        description: Max fixtures to return
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 500
            minimum: 1
          - type: 'null'
          description: Alias for limit
          title: Page Size
        description: Alias for limit
      - name: tour
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tour
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
