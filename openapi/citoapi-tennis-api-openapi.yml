        minus winner saved) -- over the opponent''s service games played

        (loser/winner sv_gms). sv_gms semantics are verified, not assumed: over

        234,635 tiebreak-free matches, winner+loser sv_gms equals total set games

        in 98.05%; over 96,174 tiebreak matches it equals total minus tiebreak

        sets in 97.0% (tiebreaks are not service games, the correct tour

        convention); derived breaks fit within sv_gms in 99.5% of 330,922

        fully-populated rows; Alcaraz ATP 2026 comes out 31.3%, the realistic

        tour-level band. Only players with at least 100 return games played

        qualify (ATP 2026: 987 eligible, top 51.5; WTA 2026: 567 eligible, top

        64.0). Rows missing any of the three opponent-side inputs are excluded,

        never defaulted. No estimates: a player with no stat rows simply does

        not appear.'
