          description: Max live matches to return
          title: Limit
        description: Max live matches to return
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 500
            minimum: 1
          - type: 'null'
          description: Alias for limit
          title: Page Size
        description: Alias for limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisListResponse_LiveMatchSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisHTTPValidationError'
      security:
      - ApiKeyAuth: []
