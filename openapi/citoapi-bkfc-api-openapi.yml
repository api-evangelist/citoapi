      x-operation-id-source: derived
  /bkfc/events:
    get:
      tags:
      - BKFC
      summary: List events
      description: 'Every BKFC event since 2018, newest first. Alias: /fight-cards.'
      parameters:
      - name: status
        in: query
        required: false
        description: scheduled, live, completed, cancelled (comma-separated)
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: numbered, fight_night, prospect, other
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Earliest event date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Latest event date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: q
        in: query
        required: false
        description: Name / venue filter
        schema:
          type: string
      - name: includeBouts
        in: query
        required: false
        description: Add each card
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        description: Page size (max 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BkfcEvent'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BkfcError'
        '404':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
