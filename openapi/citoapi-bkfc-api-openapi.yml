components:
  schemas:
    BkfcFighter:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        nickname:
          type:
          - string
          - 'null'
        gender:
          type:
          - string
          - 'null'
        division:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        nationality:
          type:
          - string
          - 'null'
        birthMonth:
          type:
          - string
          - 'null'
          example: 1987-09
        heightCm:
          type:
          - number
          - 'null'
        reachCm:
          type:
          - number
          - 'null'
        record:
          type: object
          properties:
            wins:
              type: integer
            losses:
              type: integer
            draws:
              type: integer
            noContests:
              type: integer
            koWins:
              type: integer
    BkfcError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
            docs:
              type: string
    BkfcBout:
      type: object
      properties:
        boutId:
          type: string
        event:
          type: object
        order:
          type:
          - integer
          - 'null'
          description: 1 = main event
        section:
          type:
          - string
          - 'null'
        slot:
          type:
          - string
          - 'null'
        weightClass:
          type: object
        titleFight:
          type: boolean
        scheduledRounds:
          type:
          - integer
          - 'null'
        roundSeconds:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - scheduled
          - live
          - completed
          - cancelled
        fighters:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              corner:
                type: string
                enum:
                - red
                - blue
              slug:
                type: string
              name:
                type: string
              nickname:
                type:
                - string
                - 'null'
              weighInLb:
                type:
                - number
                - 'null'
              result:
                type:
                - string
                - 'null'
              totals:
                $ref: '#/components/schemas/BkfcStatLine'
        winner:
          type:
          - object
          - 'null'
        result:
          type:
          - object
          - 'null'
          properties:
            outcome:
              type: string
            method:
              type: string
            methodText:
              type: string
            round:
              type: integer
            time:
              type: string
            elapsedSeconds:
              type: integer
        referee:
          type:
          - string
          - 'null'
        statsAvailable:
          type: boolean
        rounds:
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
              red:
                $ref: '#/components/schemas/BkfcStatLine'
              blue:
                $ref: '#/components/schemas/BkfcStatLine'
        cancellation:
          type:
          - object
          - 'null'
          properties:
            reason:
              type: string
              enum:
              - removed_from_card
              - moved
              - opponent_changed
              - event_cancelled
              - not_in_official_results
            movedToEvent:
              type:
              - string
              - 'null'
            replacedByBoutId:
              type:
              - string
              - 'null'
            removedAt:
              type:
              - string
              - 'null'
    BkfcEvent:
      type: object
      properties:
        slug:
          type: string
          example: bkfc-50-denver
        name:
          type: string
        type:
          type: string
        number:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - scheduled
          - live
          - completed
          - cancelled
          - postponed
        date:
          type: string
          format: date
        localTime:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        startsAt:
          type:
          - string
          - 'null'
          format: date-time
        previousDates:
          type: array
          items:
            type: string
            format: date
        location:
          type: object
          properties:
            venue:
              type:
              - string
              - 'null'
            text:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            region:
              type:
              - string
              - 'null'
            country:
              type:
              - string
              - 'null'
        bouts:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
        card:
          type: array
          items:
            $ref: '#/components/schemas/BkfcBout'
    BkfcStatLine:
      type:
      - object
      - 'null'
      properties:
        landed:
          type:
          - integer
          - 'null'
        thrown:
          type:
          - integer
          - 'null'
        missed:
          type:
          - integer
          - 'null'
        knockdowns:
          type:
          - integer
          - 'null'
        headLanded:
          type:
          - integer
          - 'null'
        headThrown:
          type:
          - integer
          - 'null'
        bodyLanded:
          type:
          - integer
          - 'null'
        bodyThrown:
          type:
          - integer
          - 'null'
        distanceLanded:
          type:
          - integer
          - 'null'
        distanceThrown:
          type:
          - integer
          - 'null'
        clinchLanded:
          type:
          - integer
          - 'null'
        clinchThrown:
          type:
          - integer
          - 'null'
        distanceHeadLanded:
          type:
          - integer
          - 'null'
        distanceBodyLanded:
          type:
          - integer
          - 'null'
        clinchHeadLanded:
          type:
          - integer
          - 'null'
        clinchBodyLanded:
          type:
          - integer
          - 'null'
        accuracyPct:
          type:
          - number
          - 'null'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Cito API key. Get one at https://citoapi.com
