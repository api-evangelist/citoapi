openapi: 3.2.0
info:
  title: Cito BKFC API
  version: 1.0.0
  description: Utilities API — QR code generation and sports/esports data (Fortnite, CoD, LoL, Apex, Dota 2, CS2, UFC, Tennis, RAF Wrestling, BKFC).
  contact:
    name: Cito API Support
    url: https://citoapi.com
  x-logo:
    url: https://citoapi.com/logo.png
servers:
- url: https://api.citoapi.com/api/v1
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: BKFC
  description: 'Bare Knuckle Fighting Championship: every event since 2018, full cards, results, round-by-round punch statistics, fighters, official rankings and live cards.'
paths:
  /bkfc:
    get:
      tags:
      - BKFC
      summary: BKFC overview
      description: Counts, next event, current champions.
      parameters: []
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BkfcError'
        '404':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BkfcError'
      operationId: getBkfc
      x-operation-id-source: derived
  /bkfc/search:
    get:
      tags:
      - BKFC
      summary: Search fighters and events
      description: Name, nickname or slug to ids.
      parameters:
      - name: q
        in: query
        required: true
        description: Search text.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: fighter or event
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size (max 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BkfcError'
        '404':
          description: Error (BKFC_EVENT_NOT_FOUND, BKFC_BOUT_NOT_FOUND, BKFC_FIGHTER_NOT_FOUND, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BkfcError'
      operationId: getBkfcSearch
      x-operation-id-source: derived
  /bkfc/sync/status:
    get:
      tags:
      - BKFC
      summary: Data freshness
      description: Last successful sync and counts.
      parameters: []
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
