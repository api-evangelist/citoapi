- aid: citoapi:citoapi-cs2-api
  name: Cito CS2 API CS2 API
  description: >-
    Counter-Strike 2: live matches, results, maps, rounds, teams, players, events, rankings, stats and
    skins.


    **Beta.** CS2 is in beta. If anything looks wrong, email support@citoapi.com with the endpoint and
    the id you called. Docs: https://citoapi.com/docs/api/cs2


    **Response shape.** Every response is `{ success, data, meta }`. Lists put rows in `data` and counts
    or paging in `meta`.


    **Ids.** Matches, teams, players and events have ids like `cs2-match-2398421`, `cs2-team-7020`, `cs2-player-11893`,
    `cs2-event-8038`. Teams, players and events also accept their slug (`vitality`, `zywoo`).


    **Paging.** `limit` sets how many rows come back. Each endpoint lists its own maximum (100 on most).
    Asking for more returns the maximum, not an error. Page with `offset` or `page` where the endpoint
    lists them.


    **Lists are compact.** List endpoints return summary rows. Fetch the single record (`/cs2/events/{eventIdOrSlug}`,
    `/cs2/teams/{teamIdOrSlug}`) for the full structure.


    **Images.** Logos, player photos, map images and event banners are served from `api.citoapi.com` and
    do not change address. An image field is `null` when we have no image for that record yet. Treat `null`
    as "no image" and show a placeholder.


    **Missing data.** When a record exists but a section has no data yet, the response says so with `data_available:
    false` and an `unavailable_reason`, rather than an error.


    **Times** are ISO 8601 in UTC.
  humanURL: https://citoapi.com/docs/api/cs2
  baseURL: https://api.citoapi.com/api/v1
