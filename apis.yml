aid: citoapi
name: Cito CS2 API
image: https://citoapi.com/images/og-image.png
description: Cito CS2 API provides live data for Counter-Strike 2, League of Legends, Dota 2, Call of Duty, Apex Legends, and UFC. It aggregates
  match scores, player statistics, team rosters, rankings, and skin/item prices across dozens of marketplaces, delivering clean JSON via a single
  API key. The service includes an MCP server for agent integration and SDKs for JavaScript and Python, targeting developers building esports
  analytics, betting, or game‑related applications.
